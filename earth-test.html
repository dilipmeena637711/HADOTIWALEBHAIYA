<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>HADOTI WALE BHAIYA - 3D Earth</title>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>

<link
  href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css"
  rel="stylesheet"
>

<style>

html,
body,
#cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: #000;
  font-family: Arial, sans-serif;
}

/* Loading Screen */

#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  background:
    radial-gradient(
      circle at center,
      #12345c 0%,
      #020711 55%,
      #000 100%
    );

  color: white;

  transition: opacity 0.8s ease;
}

#loading h1 {
  margin: 0 0 12px;
  font-size: 28px;
  letter-spacing: 1px;
}

#loading p {
  margin: 0;
  opacity: 0.75;
  font-size: 14px;
}

.loader {
  width: 42px;
  height: 42px;

  margin-bottom: 20px;

  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: white;

  border-radius: 50%;

  animation: spin 1s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

/* Bottom Hint */

#hint {
  position: fixed;

  left: 50%;
  bottom: 25px;

  transform: translateX(-50%);

  z-index: 1000;

  padding: 10px 16px;

  border-radius: 30px;

  background: rgba(0,0,0,0.55);

  backdrop-filter: blur(8px);

  color: white;

  font-size: 13px;

  text-align: center;

  pointer-events: none;
}

</style>

</head>

<body>

<!-- Loading -->

<div id="loading">

  <div class="loader"></div>

  <h1>🌍 HADOTI WALE BHAIYA</h1>

  <p>Loading 3D Earth...</p>

</div>


<!-- Cesium -->

<div id="cesiumContainer"></div>


<!-- Instructions -->

<div id="hint">

  👆 Drag = Rotate
  &nbsp; • &nbsp;
  🤏 Pinch = Zoom
  &nbsp; • &nbsp;
  🖱️ Mouse Wheel = Zoom

</div>


<script>

/*
==================================================
CESIUM TOKEN
==================================================
*/

Cesium.Ion.defaultAccessToken =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Ilg3SU42Y0hPMi12a2p2UmkiLCJqdGkiOiJmOTA1NzhjZC05NGY4LTQwYzAtODE4MS00MzNmNDk4ZmYxMWUiLCJpZCI6NDY3MDczLCJzdWIiOiJESUxJUE1FRU5BNjM3NzExIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IkRJTElQTUVFTkE2Mzc3MTFfZGVmYXVsdCIsImlhdCI6MTc4Njc2MDI3Nn0.pBF-YOXeINumtdEFJ6b7hvZMWtCXViNsdgk1llhlPnE";


/*
==================================================
CREATE CESIUM VIEWER
==================================================
*/

const viewer = new Cesium.Viewer(
  "cesiumContainer",
  {

    /*
    Global Earth imagery
    */

    baseLayer:
      Cesium.ImageryLayer.fromWorldImagery(),

    /*
    IMPORTANT:
    Terrain अभी OFF है।
    पहले basic Earth verify करेंगे।
    */

    terrain: false,

    /*
    UI controls
    */

    animation: false,

    timeline: false,

    baseLayerPicker: false,

    geocoder: false,

    homeButton: false,

    sceneModePicker: false,

    navigationHelpButton: false,

    fullscreenButton: false,

    vrButton: false,

    infoBox: false,

    selectionIndicator: false

  }
);


/*
==================================================
EARTH LIGHTING
==================================================
*/

viewer.scene.globe.enableLighting = true;

viewer.scene.globe.showGroundAtmosphere = true;

viewer.scene.skyAtmosphere.show = true;

viewer.scene.sun.show = true;

viewer.scene.moon.show = true;


/*
==================================================
SPACE BACKGROUND
==================================================
*/

viewer.scene.backgroundColor =
  Cesium.Color.BLACK;


/*
==================================================
INITIAL CAMERA
==================================================
*/

/*
India के ऊपर से global Earth view
*/

viewer.camera.setView({

  destination:
    Cesium.Cartesian3.fromDegrees(
      78.9629,
      22.5937,
      18000000
    ),

  orientation: {

    heading:
      Cesium.Math.toRadians(0),

    pitch:
      Cesium.Math.toRadians(-90),

    roll: 0

  }

});


/*
==================================================
TOUCH / MOUSE CONTROLS
==================================================
*/

const controller =
  viewer.scene.screenSpaceCameraController;


controller.enableRotate = true;

controller.enableZoom = true;

controller.enableTilt = true;

controller.enableLook = true;


/*
==================================================
LOADING SCREEN
==================================================
*/

setTimeout(() => {

  const loading =
    document.getElementById("loading");

  if (loading) {

    loading.style.opacity = "0";

    setTimeout(() => {

      loading.style.display = "none";

    }, 800);

  }

}, 3000);


/*
==================================================
DEBUG MESSAGE
==================================================
*/

console.log(
  "HADOTI WALE BHAIYA 3D Earth initialized."
);

</script>

</body>

</html>
